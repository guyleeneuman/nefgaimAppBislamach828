<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פקל נפגעים למפקד-חטיבת ביסלח</title>
  <link rel="stylesheet" href="subs.css">
</head>
<body>
    <img class="navbar" src="assets/logos/logos.png" alt="icon 1">
    <img class="title" src="assets/elements/sub22.png" alt="icon 1">
    <div class="infoBox">
     <h2 id="boxTitle"></h2>
     <p id="boxText"></p>
    </div>


     <img class="forword" src="assets/buttons/forword.png" alt="icon 1">
    <img class="back" src="assets/buttons/back.png" alt="icon 1">

       <div class="toSub" onclick="goTosub2()">
    <img src="assets/buttons/backToSub2.png" alt="start button">
  </div>
      <div class="toMenu" onclick="gotoMenu()">
    <img src="assets/buttons/toMenu.png" alt="start button">
  </div>

</body>
<script>  
function gotoMenu() {
    window.location.href = "menu.html";
}
function goTosub11() {
    window.location.href = "sub21.html";
}
function goTosub2() {
    window.location.href = "sub2.html";
}

const content = [
    {
        title: "עם מות חייל ועד אחרי הלוויה פועלים במקביל ובתאום שלושה גורמים צבאיים:",
        text: ""
    },
    {
        title: "הגורמים הצבאיים הפועלים:",
        text: "1) יחידת החייל. \n 2) ענף נפגעים במקלשר (חמל + זירה רלוונטית).\n 3) מדור נפגעים חיילי. \n לכל גוף תפקיד מוגדר ונכון לשמור על מסגרת זו!"
    },
    {
        title: "פעילות היחידה: (פ.מ 38.0103 סעיפים 12-23)",
        text: "1) נקיטת כל האמצעים הדרושים כדי למנוע שהידיעה תגיע למשפחה לפני הודעת מודיעי הנפגעים. \n 2) זיהוי החלל."
    },
    {
        title: "פעילות היחידה: (פ.מ 38.0103 סעיפים 12-23)",
        text: "3) דיווח מהיר לכל הגורמים המצויינים בפקודות. \n"
    },
    {
        title: "פעילות היחידה: (פ.מ 38.0103 סעיפים 12-23)",
        text: "4)אחריות משותפת עם מודיע נפגעים והמפקדה הממונה לתאום סדרי הלוויה והכנת הטקס"
    },
    {
        title: "פעילות היחידה: (פ.מ 38.0103 סעיפים 12-23)",
        text: "5) ריכוז חפצים, מסמכים, תעודות וחפצי החלל והכנתם למסירה למשפחה (עד אזכרת ה30)"
    },
{  
        title: "פעילות היחידה: (פ.מ 38.0103 סעיפים 12-23)",
        text: "6) שליחת שני מזהים טרם חתימת הארון"
},
{ 
        title: "אחריות היחידה בטקס ההלוויה:",
        text: "1) הקצאת חיילים למשמר כבוד, נשיאת ארון וכיתת ירי.\n 2) הקצאת חיילות נושאי זרים "
    },
    { 
        title: "אחריות היחידה בטקס ההלוויה:",
        text: "3) הקצאת כח רפואי להלוויה.\n 4) מספיד בהלוויה- מפקד היחידה."
    },
      { 
        title: "",
        text: "כל הפעולות הקשורות באירוע של חלל ובטיפול במשפחתו עד תום שבעת ימי האבל הינן באחריות נציגי ענף נפגעים ויחידת החלל.מהיום השמיני הטיפול עובר למדור נפגעים."

    },
    { 
        title: "",
        text:"אין לבצע כל פעולה מבלי להיות בטוח שכך עלייך לנהוג.יש לעמוד בקשר רציף עם קצינת הנפגעים בכל התלבטות או שאלה."
 }
 ]

let currentIndex = 0;

const titleEl = document.getElementById("boxTitle");
const textEl = document.getElementById("boxText");
const forwardBtn = document.querySelector(".forword");
const backBtn = document.querySelector(".back");

// פונקציה שמעדכנת תצוגה
function updateContent() {
    titleEl.innerText = content[currentIndex].title;
    textEl.innerText = content[currentIndex].text;

    // הסתרת כפתורים בקצוות
    backBtn.style.display = currentIndex === 0 ? "none" : "block";
    forwardBtn.style.display = currentIndex === content.length - 1 ? "none" : "block";
}

// כפתור קדימה
forwardBtn.addEventListener("click", () => {
    if (currentIndex < content.length - 1) {
        currentIndex++;
        updateContent();
    }
});

// כפתור אחורה
backBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
        currentIndex--;
        updateContent();
    }
});

// התחלה
updateContent();
</script> 
</html>
