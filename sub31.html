let currentIndex = 0;

const titleEl = document.getElementById("boxTitle");
const textEl = document.getElementById("boxText");
const forwardBtn = document.querySelector(".forword");
const backBtn = document.querySelector(".back");

// פונקציה שמעדכנת תצוגה
function updateContent() {
    titleEl.innerText = content[currentIndex].title;
    textEl.innerText = content[currentIndex].text;

    // הסתרת כפתורים בקצוות
    backBtn.style.display = currentIndex === 0 ? "none" : "block";
    forwardBtn.style.display = currentIndex === content.length - 1 ? "none" : "block";
}

// כפתור קדימה
forwardBtn.addEventListener("click", () => {
    if (currentIndex < content.length - 1) {
        currentIndex++;
        updateContent();
    }
});

// כפתור אחורה
backBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
        currentIndex--;
        updateContent();
    }
});

// התחלה
updateContent();
