<body>

     <img class="forword" src="assets/buttons/forword.png" alt="icon 1">
    <img class="back" src="assets/buttons/back.png" alt="icon 1">

       <div class="toSub" onclick="goTosub5()">

<script>  
function gotoMenu() {
    window.location.href = "menu.html";
}
function goTosub11() {

}
function goTosub2() {

}

const content = [
    {
        title: "בעת קבלת פקודת הנציגות:",
        text: "מדור נפגעים אחראי לתאם את האזכרות אל מול המשפחות ולהעביר בהתאם דרישת נציגות ליחידת הנופל. ברגע קבלת הפקודה, על היחידה יש להערך להעמדת הנציגות המבוקשת בהתחשב לפרטים הבאים:"
    },
    {
        title: "בעת קבלת פקודת הנציגות:",
        text: "1) במידה והמשפחה מבקשת- השלמת מניין.בעת הגעה לאזכרה שביקשו בה השלמת מניין יש לוודא שכלל החיילים הינם גברים יהודים ולא כהנים על מנת שיוכלו להשלים מניין."
    },
    {
        title: "בעת קבלת פקודת הנציגות:",
        text: "2) הגעת מפקד נציגים- קצין / נגד שהינו בדרגה גבוהה יותר מדרגת החלל. לדוגמא- במידה ודרגת החלל הינה סגן, חשוב שיגיע מפקד נציגים, קצין בדרגת סגן ומעלה. "
    },
    {
        title: "בעת קבלת פקודת הנציגות:",
        text: "3)הרבה פעמים עם פקודת העמדת הנציגים נשלחת גם פקודת העמדת אמצעים. במידה ונשלחת גם פקודת העמדת אמצעים יש לשים לב שהנציגים מגיעים עם כלל האמצעים המבוקשים מהגדוד לאזכרה. "
    },
    {
        title: "בעת קבלת פקודת הנציגות:",
        text: "4)פעמים רבות לאחר האזכרה המשפחה מבצעת סעודת מצווה בביתה או בבית העלמין, במידה ומדור הנפגעים ידע על הסעודה לפני כן הוא יידע את היחידה. לא תמיד מדור הנפגעים מודע לסעודה לפני כן ולכן חשוב מלכתחילה להערך להגעה גם לסעודה לאחר האזכרה. "
    },
    {
        title: "בעת קבלת פקודת הנציגות:",
        text: "5)פקודת העמדת הנציגים נשלחת לאיש הקשר מכל יחידה גם  במייל הצבאי וגם כהודעת וואטסאפ, בעת קבלת פקודת נציגות יש לאשר קבלה. "
    },
    {
        title: "בעת קבלת פקודת הנציגות:",
        text: "6)את הנציגים יש להעביר לאיש הקשר ממדור הנפגעים לפחות יום טרם מועד האזכרה. יום טרם מועד האזכרה תפתח קבוצה עם כלל הנציגים בה ישלחו כל הפרטים העדכניים יחד עם דגשים לאזכרה. "
    },
    {
        title: "בעת קבלת פקודת הנציגות:",
        text: "7)מדור נפגעים כאן עבורכם לכל שאלה וחידוד."
    },
    {
        title: "דגשים לנציגות באזכרה:",
        text: "על החיילים שמגיעים לאזכרה יש לקרוא בעיון את הדגשים לנציגות, על כל מפקד נציגים יש לבצע מעבר על הדגשים יחד עם הנציגים. מפקד הנציגים מהווה אחראי על כל הנציגים ועל התנהגותם. "
    },
     {
        title: "דגשים לנציגות באזכרה:",
        text: "1)יש לקרוא את אודות החלל ביזכור ולדעת את נסיבות נפילותיו טרם הגעה לאזכרה. \n 2)יש לגזור זמנים, על כלל הנציגים יש להגיע חצי שעה לפני מועד האזכרה. הנציגים מקבלים את המשפחה ולא הפוך! "
    },
    {
        title: "דגשים לנציגות באזכרה:",
        text: "3)יש להגיע מדוגמים ולהסתדר טרם הכניסה לבית העלמין -מדי א תקניים, נעלים מגולחצות, שרוולים למטה וכומתות על הראשים מרגע הכניסה לבית העלמין- כיפה לא מהווה תחליף. \n 4) וודאו פלאפונים על שקט. "
    },
    {
       title: "דגשים לנציגות באזכרה:",
        text: "5)  ⁠אין לעשן בבית העלמין!  \n 6) התנסחו בצורה הולמת וכבדו את המעמד. \n 7)  ⁠כל הערה/ שאלה העולה מצד המשפחה, יש להעביר למדור נפגעים באופן מיידי. \n 8) בתום האזכרה פורסת המשפחה כיבוד קל, עליכם להשתתף במעמד זה."
    },
    {
         title: "דגשים לנציגות באזכרה:",
        text: "9)  ⁠במידה והמשפחה מזמינה אתכם לביתה ניתן ורצוי להיענות בחיוב, במידה ואין באפשרותכם להשתתף יש להתנצל בנימוס."
    },
    
 ]


let currentIndex = 0;

const titleEl = document.getElementById("boxTitle");
const textEl = document.getElementById("boxText");
const forwardBtn = document.querySelector(".forword");
const backBtn = document.querySelector(".back");

// פונקציה שמעדכנת תצוגה
function updateContent() {
    titleEl.innerText = content[currentIndex].title;
    textEl.innerText = content[currentIndex].text;

    // הסתרת כפתורים בקצוות
    backBtn.style.display = currentIndex === 0 ? "none" : "block";
    forwardBtn.style.display = currentIndex === content.length - 1 ? "none" : "block";
}

// כפתור קדימה
forwardBtn.addEventListener("click", () => {
    if (currentIndex < content.length - 1) {
        currentIndex++;
        updateContent();
    }
});

// כפתור אחורה
backBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
        currentIndex--;
        updateContent();
    }
});

// התחלה
updateContent();
</script> 
</html>
