    },
 ]



let currentIndex = 0;

const titleEl = document.getElementById("boxTitle");
const textEl = document.getElementById("boxText");
const forwardBtn = document.querySelector(".forword");
const backBtn = document.querySelector(".back");

function createChoiceButtons() {
    choiceContainer.innerHTML = "";

    const buttonsData = [
        { text: "אשפוז: קשה-אנוש", goTo: 1 },
        { text: "אשפוז: בינוני", goTo: 3 },
        { text: "אשפוז: קל", goTo: 4 },
        { text: "אשפוז חייל אומ: קל", goTo: 5 },
        { text: "אשפוז: תאונה מבצעית /אימונים", goTo: 7 },
        { text: "חופשת מחלה", goTo: 10 },
        { text: "חופשת מחלה: חייל אומ", goTo: 12 },
        { text: "חייל אומ", goTo: 14 },
    ];

    buttonsData.forEach(btn => {
        const button = document.createElement("button");
        button.innerText = btn.text;

        button.addEventListener("click", () => {
            currentIndex = btn.goTo;
            updateContent();
        });

        choiceContainer.appendChild(button);
    });
}
// פונקציה שמעדכנת תצוגה
function updateContent() {
    titleEl.innerText = content[currentIndex].title;
    textEl.innerText = content[currentIndex].text;

    // כפתורי ניווט
    backBtn.style.display = currentIndex === 0 ? "none" : "block";
    forwardBtn.style.display = currentIndex === content.length - 1 ? "none" : "block";

    // 💥 הצגת כפתורים רק בטקסט השני
    if (currentIndex === 0) {
        choiceContainer.style.display = "flex";
        createChoiceButtons();
    } else {
        choiceContainer.style.display = "none";
    }
}

// כפתור קדימה
forwardBtn.addEventListener("click", () => {
    if (currentIndex < content.length - 1) {
        currentIndex++;
        updateContent();
    }
});

// כפתור אחורה
backBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
        currentIndex--;
        updateContent();
    }
});

// התחלה
updateContent();

</script>
